[alembic]
script_location = alembic
# Keep this file ASCII-only. Windows reads alembic.ini with the locale
# codec (GBK on Chinese Windows); UTF-8 punctuation will crash Alembic.
prepend_sys_path = .
# env.py always rewrites this to a sync psycopg2 URL. Do not use asyncpg.
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/conexperiment

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
